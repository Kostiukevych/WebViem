name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate project & Build Debug APK
        run: |
          echo "=== Current Directory Contents ==="
          ls -la

          # Find where settings.gradle.kts or settings.gradle is located
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Found Gradle project in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Building from current root directory"
          fi

          # Ensure gradlew has execute permission if present
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniBrowser-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          if-no-files-found: error
