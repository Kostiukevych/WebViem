name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # 1. Accept SDK licenses automatically
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

          # 2. Check if nested project directory exists
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            cd "$(dirname "$SETTINGS_FILE")"
          fi

          # 3. Generate official Gradle 8.7 wrapper directly on the runner
          echo "Generating Gradle 8.7 wrapper..."
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew

          # 4. Build Debug APK
          echo "Building Debug APK with Gradle 8.7..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniBrowser-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          if-no-files-found: error
