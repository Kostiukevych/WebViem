name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          # 1. Accept SDK licenses
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"

          # 2. Locate project root (in case repo was pushed inside a subfolder)
          SETTINGS_FILE=$(find . -maxdepth 4 -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Moving to project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi

          echo "Current directory: $(pwd)"
          ls -la

          # 3. Build APK with Gradle 8.7
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniBrowser-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          if-no-files-found: error
