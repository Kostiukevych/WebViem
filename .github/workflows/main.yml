name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses & Build Debug APK
        run: |
          yes | sdkmanager --licenses || true

          # Find project root if nested
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            cd "$(dirname "$SETTINGS_FILE")"
          fi

          echo "Running gradle assembleDebug in $(pwd)..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniBrowser-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          if-no-files-found: error
